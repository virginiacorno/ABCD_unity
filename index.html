<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Unity Web Player | ABCD_unity</title>
  <style>
    * { padding: 0; border: 0; margin: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    #unity-canvas { width: 100%; height: 100%; position: fixed; top: 0; left: 0; background: #231F20; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" width=1920 height=1080 tabindex="-1"></canvas>

  <script>
  /* ============================================================
     STEP 1: Console interceptor — BEFORE loader (critical)
     Catches Debug.Log("ABCD_DONE") from Unity
     ============================================================ */
  (function(){
    var originalLog = console.log.bind(console);
    var doneSent = false;
    var timeoutSent = false;

    console.log = function() {
      var args = Array.prototype.slice.call(arguments);
      try { originalLog.apply(console, args); } catch(_) {}

      try {
        var text = args.map(function(a) {
          return typeof a === 'object' ? JSON.stringify(a) : String(a);
        }).join(' ');

        // Catch ABCD_DONE from Debug.Log — short delay for end screen
        if (!doneSent && text.indexOf('ABCD_DONE') !== -1) {
          doneSent = true;
          setTimeout(function() {
            try { window.parent.postMessage('ABCD_DONE', '*'); } catch(e) {}
            originalLog('[postMessage bridge] ABCD_DONE sent to parent (console path).');
          }, 500);
        }

        // Catch ABCD_TIMEOUT from Debug.Log — forward immediately so Pavlovia can end the trial without saving
        if (!timeoutSent && text.indexOf('ABCD_TIMEOUT') !== -1) {
          timeoutSent = true;
          try { window.parent.postMessage('ABCD_TIMEOUT', '*'); } catch(e) {}
          originalLog('[postMessage bridge] ABCD_TIMEOUT sent to parent (console path).');
        }

        // Catch [WEBGL_DATA] logs as fallback if jslib isn't active yet
        if (text.indexOf('[WEBGL_DATA]') !== -1) {
          try {
            var jsonStart = text.indexOf('{');
            if (jsonStart !== -1) {
              var data = JSON.parse(text.substring(jsonStart));
              window.parent.postMessage({ type: 'UNITY_DATA', data: data }, '*');
            }
          } catch(e) {}
        }
      } catch(e) {}
    };
  })();

  </script>

  <!-- ============================================================
       STEP 1.5: SendDataToJS shim — ensures the function exists
       before Unity loads and tries to call it
       ============================================================ -->
  <script>
  (function(){
    if (typeof window.SendDataToJS !== 'undefined') {
      console.log('[Shim] SendDataToJS already present');
      return;
    }
    window.SendDataToJS = function(payload) {
      try {
        var s = typeof payload === 'string' ? payload : JSON.stringify(payload);
        console.log('[WEBGL_DATA] ' + s);
        try {
          var obj = JSON.parse(s);
          window.parent.postMessage({ type: 'UNITY_DATA', data: obj }, '*');
        } catch (e) {
          window.parent.postMessage({ type: 'UNITY_DATA', data: s }, '*');
        }
      } catch (e) {
        console.error('[Shim] SendDataToJS error', e);
      }
    };
    console.log('[Shim] SendDataToJS installed');
  })();
  </script>

  <script>

  /* ============================================================
     STEP 2: postMessage listener — catches ABCD_DONE arriving
     via the jslib postMessage path, forwards UNITY_DATA to
     Pavlovia parent, and handles SET_PARTICIPANT.
     ============================================================ */
  var doneSentViaMessage = false;
  var timeoutSentViaMessage = false;
  var unityInstance = null;

  window.addEventListener('message', function(event) {
    var d = event.data;

    // Detect ABCD_DONE however it arrives
    if (!doneSentViaMessage && (
        d === 'ABCD_DONE' ||
        (d && d.type === 'ABCD_DONE') ||
        (d && d.type === 'UNITY_DATA' && d.data && d.data.event_type === 'ABCD_DONE')
    )) {
      doneSentViaMessage = true;
      setTimeout(function() {
        try { window.parent.postMessage('ABCD_DONE', '*'); } catch(e) {}
        console.log('[postMessage bridge] ABCD_DONE forwarded to parent (message path).');
      }, 500);
      return;
    }

    // Detect ABCD_TIMEOUT however it arrives
    if (!timeoutSentViaMessage && (
        d === 'ABCD_TIMEOUT' ||
        (d && d.type === 'ABCD_TIMEOUT') ||
        (d && d.type === 'UNITY_DATA' && d.data && d.data.event_type === 'ABCD_TIMEOUT')
    )) {
      timeoutSentViaMessage = true;
      try { window.parent.postMessage('ABCD_TIMEOUT', '*'); } catch(e) {}
      console.log('[postMessage bridge] ABCD_TIMEOUT forwarded to parent (message path).');
      return;
    }

    // Forward UNITY_DATA events to Pavlovia parent
    if (d && d.type === 'UNITY_DATA') {
      try { window.parent.postMessage(d, '*'); } catch(e) {}
    }

    // Receive participant info from Pavlovia parent
    if (d && d.type === 'SET_PARTICIPANT') {
      var payload = d.payload;
      var trySetInfo = function() {
        if (unityInstance) {
          try {
            unityInstance.SendMessage('WebDataLogger', 'SetParticipantInfo', payload);
            console.log('[Unity iframe] Sent participant info to Unity.');
          } catch(e) {
            console.error('[Unity iframe] SendMessage failed:', e);
          }
        } else {
          setTimeout(trySetInfo, 500);
        }
      };
      trySetInfo();
    }
  });
  </script>

  <script>
  /* ============================================================
     STEP 3: Load Unity via onload callback — never call
     createUnityInstance inline after <script src>
     ============================================================ */
  if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
    var meta = document.createElement('meta');
    meta.name = 'viewport';
    meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
    document.getElementsByTagName('head')[0].appendChild(meta);
  }

  var loaderScript = document.createElement('script');
  loaderScript.src = 'Build/ABCD_git.loader.js';
  loaderScript.onload = function() {
    createUnityInstance(document.querySelector("#unity-canvas"), {
      arguments: [],
      dataUrl:        "Build/ABCD_git.data",
      frameworkUrl:   "Build/ABCD_git.framework.js",
      codeUrl:        "Build/ABCD_git.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName:    "DefaultCompany",
      productName:    "ABCD_unity",
      productVersion: "0.1.0",
    }).then(function(instance) {
      unityInstance = instance;
      console.log('[Unity] Instance ready');
    }).catch(function(message) {
      alert(message);
    });
  };
  document.body.appendChild(loaderScript);
  </script>

</body>
</html>
